# Name of the IngressClass the APISIX Ingress Controller watches.
ingressClassName: apisix

# Public hosts the routes answer on. Empty matches any host.
hosts: []

# Frappe site name. Sent as the Host header, because Frappe picks the site from it.
siteName: mysite.localhost

# Kubernetes Services the routes forward to, in the release namespace.
web:
  serviceName: oan-grievance
  port: 8000
socket:
  serviceName: oan-grievance-websocket
  port: 9000

# Rate-limit counter store used by limit-count.
redis:
  host: redis

# Browser origins allowed to open a socket.io connection with a session cookie.
realtimeAllowedOrigins:
  - http://localhost:3000

# Regexes of browser origins the cors plugin allows.
corsOriginRegexes:
  - https?://localhost(:[0-9]+)?
