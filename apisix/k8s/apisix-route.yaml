          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
            Authorization: Bearer ${cookie_X-Access-Token}
          remove:
          - Cookie
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
