# Values for the oan-grievance-service chart (helm/oan-grievance-service).
# Target: the QA RKE2 node (qa.oanstaging.com), the staging environment, installed by the Jenkins stage "staging → QA cluster (helm)"
# (ci/deploy-helm-dev.sh with DEPLOY_ENV=staging). Release `grievance`, namespace `grievance`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `<version>-staging.<build>`
# - frappe.siteConfig.seed.image.tag: the same tag
# - frappe.dbHost: set below, the shared PostgreSQL of the oan-frappe-common release (namespace frappe-common)

global:
  baseDomain: qa.oanstaging.com

frappe:
  image:
    # Jenkinsfile ECR_REPO `eoan/oan-grievance-service/grievance-service`.
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/oan-grievance-service/grievance-service

  # No imagePullSecrets on QA: the node pulls from ECR with its IAM role (kubelet
  # ecr-credential-provider, docs/operations/oan-dev-deploy.md).

  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add: []
      drop:
      - ALL

  nginx:
    environment:
      # The desk host (oan-grievance-gateway.yaml desk.host) is not the site name, so nginx names the site itself.
      frappeSiteNameHeader: grievance-service.qa.oanstaging.com
      # APISIX reaches nginx from the RKE2 pod network: trust its X-Forwarded-For for the client address.
      upstreamRealIPAddress: 10.42.0.0/16
  persistence:
    worker:
      # ReadWriteMany from the NFS server.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://grievance-service.qa.oanstaging.com
    # Demo data from openg2p-data oan-seed/grievance. Built and pushed alongside the service image from ci/seed.
    seed:
      enabled: true
      image:
        repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/oan-grievance-service/grievance-seed

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777 (mountPermissions), so the
      # Frappe user can write it. The upstream root `chown -R` only races with Pods that
      # write into sites/ while the jobs run, and its failure fails the job.
      fixVolume: false
    createSite:
      forceCreate: false
      siteName: grievance-service.qa.oanstaging.com
