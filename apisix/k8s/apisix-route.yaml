apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: oan-grievance-realtime-v1
  labels:
    app: oan-grievance
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
  - name: oan-grievance-realtime-socket-io-bearer
    priority: 10
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_authorization
        op: RegexMatch
        value: ^Bearer .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
        headers:
          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
          remove:
          - Cookie
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
  - name: oan-grievance-realtime-socket-io-cookie-local
    priority: 0
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_origin
        op: In
        set:
{{- range .Values.realtimeAllowedOrigins }}
        - {{ . | quote }}
{{- end }}
      - subject:
          scope: Variable
          name: cookie_auth_token
        op: RegexMatch
        value: .+
      - subject:
          scope: Variable
          name: cookie_last_activity
        op: RegexMatch
        value: .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
        headers:
          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
            Authorization: Bearer $cookie_auth_token
          remove:
          - Cookie
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
  - name: oan-grievance-realtime-socket-io-cookie-iam
    priority: 0
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_origin
        op: In
        set:
{{- range .Values.realtimeAllowedOrigins }}
        - {{ . | quote }}
{{- end }}
      - subject:
          scope: Variable
          name: cookie_X-Access-Token
        op: RegexMatch
        value: .+
      - subject:
          scope: Variable
          name: cookie_auth_token
        op: RegexNotMatch
        value: .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
