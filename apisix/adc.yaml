- name: oan-grievance-realtime-v1
  labels:
    app: oan-grievance
  upstream:
    scheme: http
    nodes:
    - host: oan-grievance-websocket.internal.svc
      port: 9000
      weight: 1
    pass_host: pass
    timeout:
      connect: 5
      send: 3600
      read: 3600
    retries: 0
  plugins:
    request-id:
      header_name: X-Request-Id
      include_in_response: true
    prometheus:
      prefer_name: true
  routes:
  - name: oan-grievance-realtime-socket-io-bearer
    labels:
      app: oan-grievance
      tier: realtime
      auth: bearer
    uris:
    - /socket.io/
    - /socket.io/*
    vars:
    - - http_authorization
      - ~~
      - ^Bearer .+
    priority: 10
    enable_websocket: true
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
      proxy-rewrite:
        host: mysite.localhost
        headers:
          set:
            Origin: http://mysite.localhost:8000
            X-Frappe-Site-Name: mysite.localhost
          remove:
          - Cookie
  - name: oan-grievance-realtime-socket-io-cookie-local
    labels:
      app: oan-grievance
      tier: realtime
      auth: cookie
    uris:
    - /socket.io/
    - /socket.io/*
    vars:
    - - http_origin
      - in
      - - http://localhost:3000
    - - cookie_auth_token
      - ~~
      - .+
    - - cookie_last_activity
      - ~~
      - .+
    priority: 0
    enable_websocket: true
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
      proxy-rewrite:
        host: mysite.localhost
        headers:
          set:
            Origin: http://mysite.localhost:8000
            X-Frappe-Site-Name: mysite.localhost
            Authorization: Bearer $cookie_auth_token
          remove:
          - Cookie
  - name: oan-grievance-realtime-socket-io-cookie-iam
    labels:
      app: oan-grievance
      tier: realtime
      auth: cookie
    uris:
    - /socket.io/
