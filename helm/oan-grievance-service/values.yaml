# Defaults for OAN Grievance Redressal. Everything sits under `frappe`, the values of the
# frappe chart this one depends on. Per-environment values live in
# environments/<env>/values/oan-grievance-service.yaml.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>` (locally: `develop`)
# - frappe.dbHost: the PostgreSQL server (set in the environment file)
# Image repositories, the seed image and dbRootUser are per environment.
# Secrets the chart generates once and keeps across upgrades (templates/secrets.yaml), see `secrets` below:
# - oan-grievance-admin (key `password`): Frappe Administrator password
# - oan-grievance-jwt (key `jwt_v1.pem`): RSA private key that signs access tokens
# - oan-grievance-secret-key (key `secret_key`): the site's HMAC secret_key
# Secrets created outside Git, in the release namespace:
# - oan-frappe-common-db (key `password`): the `postgres` password, copied from the frappe-common namespace
# - oan-grievance-sentry (key `dsn`): Sentry DSN. Optional.
# - oan-grievance-seed (key `password`): password for the demo users. Optional.

# Set create=false to bring your own Secret with the same name and keys.
secrets:
  admin:
    create: true
    name: oan-grievance-admin
  secretKey:
    create: true
    name: oan-grievance-secret-key
  jwt:
    create: true
    name: oan-grievance-jwt

frappe:
  image:
    # Set per environment. package_chart.py needs both keys to exist.
    repository: ""
    tag: ""

  # PostgreSQL runs outside the cluster. The create-site job reads the password of dbRootUser
  # from Secret oan-frappe-common-db, a copy of the one the frappe-common release creates.
  dbHost: ""
  dbPort: 5432
  dbExistingSecret: oan-frappe-common-db
  dbExistingSecretPasswordKey: password
  postgresql-sts:
    enabled: false

  siteConfig:
    enabled: true
    values:
      jwt_current_kid: v1
      jwt_private_keys:
        v1: keys/jwt_v1.pem
      jwt_default_registration_role: Grievance Submitter
      jwt_self_registerable_roles:
      - Grievance Submitter
      jwt_issuer: oan-grievance
    secretValues:
      secret_key:
        secretName: oan-grievance-secret-key
        secretKey: secret_key
    files:
    # oan_auth_service refuses every login without it.
    - path: keys/jwt_v1.pem
      secretName: oan-grievance-jwt
      secretKey: jwt_v1.pem
    seed:
      userPasswordSecret:
        name: oan-grievance-seed

  # FRAPPE_STREAM_LOGGING sends frappe.logger output to stdout for the cluster log collector.
  # FRAPPE_SENTRY_DSN is optional: without the Secret, Sentry stays off.
  nginx:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
  worker:
    gunicorn:
      envVars: &frappeEnv
      - name: FRAPPE_STREAM_LOGGING
        value: "1"
      - name: FRAPPE_SENTRY_DSN
        valueFrom:
          secretKeyRef:
            name: oan-grievance-sentry
            key: dsn
            optional: true
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 25m
          memory: 320Mi
    default:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
    short:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
    long:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
    scheduler:
      envVars: *frappeEnv
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
  socketio:
    envVars: *frappeEnv
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

  # The queues the app enqueues on (oan_grievance_service/services/constants.py) and their RQ timeouts
  # in seconds. The site-config job registers them in common_site_config.json. Each worker scales between
  # 1 and 3 replicas on CPU and memory; the targets are percentages of the requests.
  extraWorkers:
  - name: routing
    queues:
      grievance_routing: 300
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
  - name: sla
    queues:
      grievance_sla: 1800
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
  - name: scan
    queues:
      grievance_scan: 300
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
  - name: notifications
    queues:
      grievance_notifications: 600
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75

  jobs:
    createSite:
      adminExistingSecret: oan-grievance-admin
      installApps:
      - oan_auth_service
      - oan_grievance_service

# Public base domain of the environment, used to build the hosts in iamServices. Set per environment.
global:
  baseDomain: ""

# `OAN IAM Service` rows (the login options) the site-settings Job writes into the DB on every install and
# upgrade, matched by `key`. Entries use the DocType's field names; `default_roles` is a list of role
# names. Values are templates, so hosts can follow global.baseDomain. Empty: no Job, and the rows the seed
# loaded stay as they are. An environment that changes one entry repeats the whole list, as Helm replaces
# lists. The same login options as A2C (oan_a2c helm/oan-a2c-service/values.yaml).
siteSettingsJob:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  attempts: 20
iamServices:
- key: agent
  label: Agent
  enabled: 1
  sort_order: 20
  base_url: "https://staff-iam.{{ .Values.global.baseDomain }}"
  provider_id: 1
  issuer: "https://keycloak.{{ .Values.global.baseDomain }}/realms/staff"
  client_id: staff-portal
  application: oan-client
# Staff Login: the same identity provider as `agent`, listed after it. The login page picks the provider by
# `key`, and `staff` is the key of its Staff Login option.
- key: staff
  label: Staff
  enabled: 1
  sort_order: 25
  base_url: "https://staff-iam.{{ .Values.global.baseDomain }}"
  provider_id: 1
  issuer: "https://keycloak.{{ .Values.global.baseDomain }}/realms/staff"
  client_id: staff-portal
  application: oan-client
- key: beneficiary
  label: National ID (eSignet)
  enabled: 1
  sort_order: 30
  base_url: "https://bene-iam.{{ .Values.global.baseDomain }}"
  provider_id: 11
  issuer: "https://esignet.{{ .Values.global.baseDomain }}"
  # eSignet tokens carry no client roles, and the DocType refuses a row with neither an application
  # nor a default role. Someone who signs in with a national ID files grievances.
  default_roles:
  - Grievance Submitter

# Farmer Registry fields of `Grievance Settings`, written by the same Job on every install and upgrade.
# Keys are the DocType's field names; a key that is left out is not touched. Values are templates. Empty: the
# fields stay as set on the desk, and the farmer search on the intake form stays off until both are set.
# The register ID is the farmer register of the openg2p-farmer-registry chart (registerId).
farmerRegistry:
  farmer_registry_url: "https://staff-farmer.{{ .Values.global.baseDomain }}"
  farmer_register_id: a1a4d25a-1cd4-4356-abac-985a0b3c6bcd
